{% extends "base.html" %}
{% block title %}Editar Pedido{% endblock %}

{% block content %}
<div class="container">
  <h2 class="mb-4">Editar Pedido</h2>

  <form method="POST">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Numero de Pedido</label>
        <input type="text" class="form-control" name="numero_pedido" value="{{ pedido.numero_pedido }}" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Cliente</label>
        <select class="form-select" name="id_cliente" required>
          {% for c in clientes %}
          <option value="{{ c.id_cliente }}" {% if c.id_cliente == pedido.id_cliente %}selected{% endif %}>
            {{ c.nombre }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-2">
        <label class="form-label">Fecha Pedido</label>
        <input type="date" class="form-control" name="fecha_pedido" value="{{ pedido.fecha_pedido }}" required>
      </div>

      <div class="col-md-2">
        <label class="form-label">Fecha Entrega</label>
        <input type="date" class="form-control" name="fecha_entrega" value="{{ pedido.fecha_entrega }}" required>
      </div>
    </div>

    <hr>
    <h4>Piezas</h4>

    <div id="servicios-container">
      {% for d in detalles %}
      <div class="row g-2 align-items-end mb-2 servicio-row">
        <input type="hidden" name="id_pedido_servicio[]" value="{{ d.id_pedido_servicio }}">

        <div class="col-md-3">
          <label class="form-label small">Pieza</label>
          <select class="form-select form-select-sm" name="id_servicio[]" required>
            <option value="">-- Selecciona Pieza --</option>
            {% for s in servicios %}
            <option value="{{ s.id_servicio }}" {% if s.id_servicio == d.id_servicio %}selected{% endif %}>
              {{ s.referencia }} - {{ s.descripcion }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label small">Color</label>
          <select class="form-select form-select-sm" name="id_color[]" required>
            {% for col in colores %}
            <option value="{{ col.id_color }}" {% if col.id_color == d.id_color %}selected{% endif %}>
              {{ col.nombre_color }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-1">
          <label class="form-label small">Unidades</label>
          <input type="number" class="form-control form-control-sm" name="cantidad[]" value="{{ d.cantidad }}" required>
        </div>

        <div class="col-md-2">
          <label class="form-label small">Costo Unit.</label>
          <input type="number" step="0.01" class="form-control form-control-sm" name="precio_unitario[]" value="{{ d.precio_unitario }}" required>
        </div>

        <div class="col-md-1">
          <label class="form-label small">Desc.</label>
          <input type="number" step="0.01" class="form-control form-control-sm" name="descuento[]" value="{{ d.descuento }}">
        </div>

        <div class="col-md-2">
          <label class="form-label small">F. Recepcion</label>
          <input type="date" class="form-control form-control-sm" name="fecha_recepcion[]" value="{{ d.fecha_recepcion }}" required>
        </div>

        <div class="col-md-1 text-center">
          <button type="button" class="btn btn-sm btn-danger btn-remove">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
      {% endfor %}
    </div>

    <button type="button" id="add-servicio" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-plus-circle"></i> Agregar Pieza
    </button>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="submit" class="btn btn-success">
        <i class="bi bi-save"></i> Guardar Cambios
      </button>
      <a href="{{ url_for('pedidos') }}" class="btn btn-secondary">
        Cancelar
      </a>
    </div>
  </form>
</div>

<template id="servicio-template">
  <div class="row g-2 align-items-end mb-2 servicio-row">
    <input type="hidden" name="id_pedido_servicio[]" value="">

    <div class="col-md-3">
      <label class="form-label small">Pieza</label>
      <select class="form-select form-select-sm" name="id_servicio[]" required>
        <option value="">-- Selecciona Pieza --</option>
        {% for s in servicios %}
        <option value="{{ s.id_servicio }}">{{ s.referencia }} - {{ s.descripcion }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-2">
      <label class="form-label small">Color</label>
      <select class="form-select form-select-sm" name="id_color[]" required>
        {% for col in colores %}
        <option value="{{ col.id_color }}">{{ col.nombre_color }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-1">
      <label class="form-label small">Unidades</label>
      <input type="number" class="form-control form-control-sm" name="cantidad[]" required>
    </div>

    <div class="col-md-2">
      <label class="form-label small">Costo Unit.</label>
      <input type="number" step="0.01" class="form-control form-control-sm" name="precio_unitario[]" required>
    </div>

    <div class="col-md-1">
      <label class="form-label small">Desc.</label>
      <input type="number" step="0.01" class="form-control form-control-sm" name="descuento[]">
    </div>

    <div class="col-md-2">
      <label class="form-label small">F. Recepcion</label>
      <input type="date" class="form-control form-control-sm" name="fecha_recepcion[]" value="{{ fecha_hoy }}" required>
    </div>

    <div class="col-md-1 text-center">
      <button type="button" class="btn btn-sm btn-danger btn-remove">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>
</template>

<script>
document.getElementById("add-servicio").addEventListener("click", function() {
  const template = document.getElementById("servicio-template");
  document.getElementById("servicios-container").appendChild(template.content.cloneNode(true));
});

document.addEventListener("click", function(e) {
  const removeButton = e.target.closest(".btn-remove");
  if (!removeButton) return;

  const rows = document.querySelectorAll(".servicio-row");
  if (rows.length <= 1) {
    alert("El pedido debe tener al menos una pieza.");
    return;
  }

  removeButton.closest(".servicio-row").remove();
});
</script>
{% endblock %}
